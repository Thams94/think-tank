<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:;">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 群聊</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 第一栏：会话 -->
    <aside class="sessions">
      <div class="brand small">
        <span class="logo">群</span>
        <div class="brand-text">
          <div class="brand-title">AI 群聊</div>
          <div class="brand-sub" id="connState">未配置</div>
        </div>
        <button class="collapse" id="btnCollapseSessions" title="收起 / 展开会话栏">⟨</button>
      </div>
      <div class="section-title">
        会话
        <button class="mini" id="btnNewSession">+ 新建</button>
      </div>
      <div class="session-list" id="sessionList"></div>
      <div class="sidebar-foot">
        <button class="ghost" id="btnSettings">⚙ 设置</button>
      </div>
    </aside>

    <!-- 第二栏：成员 -->
    <aside class="sidebar">
      <div class="section-title members-head">
        <span class="head-label">成员 <span id="memberCount" class="pill">0</span></span>
        <button class="mini" id="btnAddMember">+ 添加</button>
        <button class="mini" id="btnGroupPrompt" title="设置当前会话的群组提示词">群组设定</button>
        <button class="collapse" id="btnCollapseMembers" title="收起 / 展开成员栏">⟨</button>
      </div>
      <div class="members" id="memberList"></div>

      <div class="sidebar-foot">
        <button class="ghost danger" id="btnClear">🗑 清空本会话</button>
      </div>
    </aside>

    <!-- 右侧：聊天 -->
    <main class="main">
      <header class="topbar">
        <div class="mode-group" id="modeGroup">
          <button class="mode" data-mode="manual">手动 @</button>
          <button class="mode" data-mode="roundrobin">轮流</button>
          <button class="mode" data-mode="moderator">主持人</button>
        </div>
        <label class="rounds">
          轮数
          <input type="number" id="rounds" min="0" max="999" value="1" title="0 = 不限轮数（自由讨论，手动停止）" />
        </label>
        <label class="rounds moderator-pick" id="moderatorWrap" hidden>
          主持
          <select id="moderatorSelect" title="选择由谁担任主持人"></select>
        </label>
        <label class="rounds inline-toggle" title="开启后每轮先联网搜索一次，结果共享给所有成员">
          <input type="checkbox" id="searchEnabled" /> 🌐 联网
        </label>
        <span class="pill" id="usageTotal"></span>
        <div class="hint" id="modeHint"></div>
        <button class="mini" id="btnExport">导出 MD</button>
      </header>

      <div class="messages" id="messages"></div>

      <footer class="composer">
        <textarea id="input" rows="3"
          placeholder="输入内容，Enter 发送，Shift+Enter 换行"></textarea>
        <div class="at-hint">
          <span><code>@名字</code> 公开点名</span>
          <span class="priv"><code>@@名字</code> 私密点名（只有你与被点名者可见）</span>
        </div>
        <div class="composer-actions">
          <div class="quick" id="quickAt"></div>
          <button class="ghost kb-open-btn" id="btnKb" title="打开知识库">📚 知识库</button>
          <button class="ghost" id="btnStop" hidden>停止</button>
          <button class="primary" id="btnSend">发送</button>
        </div>
      </footer>
    </main>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal" id="modalSettings" hidden>
    <div class="modal-box wide">
      <h2>供应商 / 连接设置</h2>
      <p class="muted">可以添加多个供应商（不同 URL + Key），每个成员选用其中一个。</p>

      <div id="providerList" class="providers"></div>
      <button class="ghost add-provider" id="btnAddProvider">+ 添加供应商</button>

      <label>代理（留空 = 使用系统代理）
        <input id="proxy" placeholder="http://127.0.0.1:10808" />
      </label>
      <label>安全上限（不限轮数时，最多连续发言多少次；到上限会提示「继续」）
        <input id="safetyCap" type="number" step="10" min="1" value="200" />
      </label>
      <div class="about-box">
        <div class="about-row">
          <span class="muted">版本</span>
          <b id="appVersion">—</b>
          <span class="muted" id="engineVersion"></span>
        </div>
        <div class="about-row">
          <span class="muted">更新地址</span>
          <a href="#" id="linkUpdate" class="about-link">GitHub Releases</a>
        </div>
        <div class="about-row" id="dataDirRow" hidden>
          <span class="muted">数据目录</span>
          <code id="dataDirPath" class="about-path">—</code>
          <button class="ghost small" id="btnOpenDataDir">打开</button>
        </div>
      </div>

      <div class="modal-actions">
        <button class="ghost" id="btnCloseSettings">关闭</button>
        <button class="primary" id="btnSaveSettings">保存</button>
      </div>
    </div>
  </div>

  <!-- 通用询问弹窗（替代原生 confirm/prompt） -->
  <div class="modal" id="modalAsk" hidden>
    <div class="modal-box narrow">
      <h2 id="askTitle">请确认</h2>
      <p id="askMsg" class="muted"></p>
      <input id="askInput" hidden />
      <div class="modal-actions">
        <button class="ghost" id="askCancel">取消</button>
        <button class="primary" id="askOk">确定</button>
      </div>
    </div>
  </div>

      <!-- 群组设定弹窗 -->
  <div class="modal" id="modalGroupPrompt" hidden>
    <div class="modal-box">
      <h2>群组设定</h2>
      <p class="muted">只对**当前会话**生效。这段内容会作为系统提示发给每个成员，用来统一它们的角色和口径。</p>
      <label>群组提示词
        <textarea id="groupPrompt" rows="6" placeholder="例如：你们是一个技术评审小组，请直说问题，不要互相客套。"></textarea>
      </label>
      <div class="modal-actions">
        <button class="ghost" id="btnCancelGroupPrompt">取消</button>
        <button class="primary" id="btnSaveGroupPrompt">保存</button>
      </div>
    </div>
  </div>

  <!-- 知识库弹窗 -->
  <div class="modal" id="modalKb" hidden>
    <div class="modal-box">
      <div class="row" style="justify-content:space-between">
        <h2>知识库</h2>
        <label class="inline"><input type="checkbox" id="kbEnabled" /> 启用</label>
      </div>
      <p class="muted">把资料读进上下文再回答（按提问关键词检索，只注入最相关的片段）。图片给会看图的模型，其余模型走识别转写。</p>
      <div id="kbList" class="kb-list"></div>
      <div class="row">
        <button class="ghost" id="btnAddKb">+ 添加文件</button>
        <button class="ghost" id="btnAddKbFolder" hidden>+ 添加文件夹</button>
      </div>
      <label>注入上限（字符）
        <input id="kbBudget" type="number" step="1000" min="1000" value="12000" />
      </label>
      <div class="row kb-cache-row">
        <span class="muted" id="kbCacheInfo">解析缓存：—</span>
        <button class="ghost" id="btnClearKbCache" style="margin-left:auto;flex:none">清理解析缓存</button>
      </div>
      <div class="modal-actions">
        <button class="primary" id="btnCloseKb">完成</button>
      </div>
    </div>
  </div>

  <!-- 成员弹窗 -->
  <div class="modal" id="modalMember" hidden>
    <div class="modal-box">
      <h2 id="memberTitle">添加成员</h2>
      <label>昵称
        <input id="mName" placeholder="例如：评审员" />
      </label>
      <label>供应商
        <select id="mProvider"></select>
      </label>
      <label>模型
        <select id="mModelSelect"></select>
        <input id="mModelCustom" placeholder="自定义模型名" hidden />
      </label>
      <label>人设提示词
        <textarea id="mPersona" rows="4" placeholder="例如：你是严格的代码审查员，优先指出风险和边界条件。"></textarea>
      </label>
      <div class="row">
        <label class="half">温度
          <input id="mTemp" type="number" step="0.1" min="0" max="2" value="0.7" />
        </label>
        <label class="half">最大输出 tokens（0 = 用服务端默认）
          <input id="mMaxTokens" type="number" step="256" min="0" value="0" />
        </label>
      </div>
      <div class="row">
        <label class="half">颜色
          <input id="mColor" type="color" value="#5b8def" />
        </label>
        <label class="half checkline">
          <input type="checkbox" id="mVision" /> 支持看图（知识库图片直接给模型）
        </label>
        <label class="half">思考强度
          <select id="mReasoning">
            <option value="off">关</option>
            <option value="low">低</option>
            <option value="medium">中</option>
            <option value="high">高</option>
          </select>
        </label>
      </div>
      <div class="modal-actions">
        <button class="ghost danger" id="btnDeleteMember">删除</button>
        <button class="ghost" id="btnCloseMember">取消</button>
        <button class="primary" id="btnSaveMember">保存</button>
      </div>
    </div>
  </div>

  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
